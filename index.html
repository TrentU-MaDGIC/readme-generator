<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metadata README Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <div class="export-bar">
        <button id="exportButton">
            Export README.txt
        </button>
    </div>

    <h1>Metadata README Generator</h1>

    <div id="validation" class="validation"></div>

    <div class="layout">

        <div class="panel">

            <details open>
              <summary>General Information</summary>

              <div class="section-content">

                <label  class="required" for="datasetTitle">
                  Title of Dataset
                </label>
                <input id="datasetTitle">

                <label  class="required" for="generatedBy">
                  README Generated By
                </label>
                <input id="generatedBy">
                <h2>Contacts</h2>

                <button id="addContact">
                    Add Contact
                </button>

                <div id="contacts"></div>

              </div>

            </details>
            <details open>
                
                <summary>Data Collection</summary>

                <div class="section-content">

                    <label class="required">
                        Date of Data Collection
                    </label>
                    <textarea id="collectionDate"></textarea>

                    <label class="required">
                        Geographic Location
                    </label>
                    <textarea id="location"></textarea>

                    <label class="required">
                        Funding Sources
                    </label>
                    <textarea id="funding"></textarea>

                </div>

            </details>

            <details>
                <summary>Sharing / Access Information</summary>

                <div class="section-content">

                    <label>Licenses / Restrictions</label>
                    <textarea id="license"></textarea>

                    <label>Publications</label>
                    <textarea id="publications"></textarea>

                    <label>Public Locations</label>
                    <textarea id="publicLocations"></textarea>

                    <label>Ancillary Datasets</label>
                    <textarea id="ancillaryData"></textarea>

                    <label>Derived Source</label>
                    <textarea id="derivedSource"></textarea>

                    <label>Citation</label>
                    <textarea id="citation"></textarea>

                </div>
            </details>

            <details>
                <summary>Data & File Overview</summary>

                <div class="section-content">

                    <textarea id="fileList" placeholder="File List"></textarea>

                    <label for="fileList">
                      File List
                    </label>
                    <textarea id="fileList"></textarea>

                    <label for="fileRelationships">
                      Relationship Between Files
                    </label>
                    <textarea id="fileRelationships"></textarea>

                    <label for="additionalData">
                      Additional Related Data
                    </label>
                    <textarea id="additionalData"></textarea>

                    <label>
                      Are There Multiple Versions?
                    </label>
                    <select id="multipleVersions">
                      <option value="">Select</option>
                      <option value="Yes">Yes</option>
                      <option value="No">No</option>
                    </select>

                    <label for="updatedFiles">
                      Updated Files
                    </label>
                    <textarea id="updatedFiles"></textarea>

                    <label for="updateReason">
                      Reason Updated
                    </label>
                    <textarea id="updateReason"></textarea>

                    <label for="updateDate">
                      Update Date
                    </label>
                    <input id="updateDate" type="date">

                </div>
            </details>

            <details>
                <summary>Methodological Information</summary>

                <div class="section-content">

                    <label for="methods">
                      Description of Methods Used for Collection/Generation of Data
                    </label>
                    <textarea id="methods"></textarea>

                    <label for="processing">
                      Methods for Processing the Data
                    </label>
                    <textarea id="processing"></textarea>

                    <label for="software">
                      Instrument- or Software-Specific Information
                    </label>
                    <textarea id="software"></textarea>

                    <label for="standards">
                      Standards and Calibration Information
                    </label>
                    <textarea id="standards"></textarea>

                    <label for="conditions">
                      Environmental / Experimental Conditions
                    </label>
                    <textarea id="conditions"></textarea>

                    <label for="qa">
                      Quality Assurance Procedures
                    </label>
                    <textarea id="qa"></textarea>

                    <label for="personnel">
                      People Involved with Collection, Processing, Analysis, and Submission
                    </label>
                    <textarea id="personnel"></textarea>

                </div>
            </details>

            <h2>Datasets / Files</h2>

            <button id="addDataset">
                Add Dataset/File
            </button>

            <div id="datasets"></div>

            <h2>Optional Sections</h2>

            <button id="addSection">
                Add Section
            </button>

            <div id="customSections"></div>

        </div>

        <div class="panel">

            <h2>Live README Preview</h2>

            <div id="preview" class="preview"></div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
