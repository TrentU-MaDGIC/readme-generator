<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metadata README Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <h1>Metadata README Generator</h1>

    <h2>Required Metadata</h2>

    <label>Date of Data Collection</label>
    <textarea id="collectionDate"></textarea>

    <label>Geographic Location of Data Collection</label>
    <textarea id="location"></textarea>

    <label>Funding Sources</label>
    <textarea id="funding"></textarea>

    <h2>Sharing / Access Information</h2>

    <label>Licenses / Restrictions</label>
    <textarea id="license"></textarea>

    <label>Publications</label>
    <textarea id="publications"></textarea>

    <label>Public Data Locations</label>
    <textarea id="publicLocations"></textarea>

    <label>Ancillary Datasets</label>
    <textarea id="ancillaryData"></textarea>

    <label>Derived From Another Source?</label>
    <textarea id="derivedSource"></textarea>

    <label>Recommended Citation</label>
    <textarea id="citation"></textarea>

    <h2>Data & File Overview</h2>

    <label>File List</label>
    <textarea id="fileList"></textarea>

    <label>Relationship Between Files</label>
    <textarea id="fileRelationships"></textarea>

    <label>Additional Related Data</label>
    <textarea id="additionalData"></textarea>

    <label>Updated Files</label>
    <textarea id="updatedFiles"></textarea>

    <label>Reason Updated</label>
    <textarea id="updateReason"></textarea>

    <label>Date Updated</label>
    <input type="date" id="updateDate">

    <h2>Methodological Information</h2>

    <label>Methods</label>
    <textarea id="methods"></textarea>

    <label>Processing Methods</label>
    <textarea id="processing"></textarea>

    <label>Software Information</label>
    <textarea id="software"></textarea>

    <label>Standards & Calibration</label>
    <textarea id="standards"></textarea>

    <label>Environmental Conditions</label>
    <textarea id="conditions"></textarea>

    <label>QA Procedures</label>
    <textarea id="qa"></textarea>

    <label>Personnel</label>
    <textarea id="personnel"></textarea>

    <h2>Datasets / Files</h2>

    <button id="addDataset">
        Add Dataset/File
    </button>

    <div id="datasets"></div>

    <h2>Optional Sections</h2>

    <button id="addSection">
        Add Section
    </button>

    <div id="customSections"></div>

    <hr>

    <button id="exportButton">
        Export README.txt
    </button>

    <h2>Preview</h2>

    <pre id="preview"></pre>

</div>

<script src="app.js"></script>

</body>
</html>
