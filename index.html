<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metadata README Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <div class="export-bar">
        <button id="exportButton">
            Export README.txt
        </button>
    </div>

    <h1>Metadata README Generator</h1>

    <div id="validation" class="validation"></div>

    <div class="layout">

        <div class="panel">

            <details open>
                <summary>Required Metadata</summary>

                <div class="section-content">

                    <label class="required">
                        Date of Data Collection
                    </label>
                    <textarea id="collectionDate"></textarea>

                    <label class="required">
                        Geographic Location
                    </label>
                    <textarea id="location"></textarea>

                    <label class="required">
                        Funding Sources
                    </label>
                    <textarea id="funding"></textarea>

                </div>

            </details>

            <details>
                <summary>Sharing / Access Information</summary>

                <div class="section-content">

                    <label>Licenses / Restrictions</label>
                    <textarea id="license"></textarea>

                    <label>Publications</label>
                    <textarea id="publications"></textarea>

                    <label>Public Locations</label>
                    <textarea id="publicLocations"></textarea>

                    <label>Ancillary Datasets</label>
                    <textarea id="ancillaryData"></textarea>

                    <label>Derived Source</label>
                    <textarea id="derivedSource"></textarea>

                    <label>Citation</label>
                    <textarea id="citation"></textarea>

                </div>
            </details>

            <details>
                <summary>Data & File Overview</summary>

                <div class="section-content">

                    <textarea id="fileList" placeholder="File List"></textarea>

                    <textarea id="fileRelationships"
                        placeholder="Relationships">
                    </textarea>

                    <textarea id="additionalData"
                        placeholder="Additional Data">
                    </textarea>

                    <textarea id="updatedFiles"
                        placeholder="Updated Files">
                    </textarea>

                    <textarea id="updateReason"
                        placeholder="Update Reason">
                    </textarea>

                    <input id="updateDate" type="date">

                </div>
            </details>

            <details>
                <summary>Methodological Information</summary>

                <div class="section-content">

                    <textarea id="methods"
                        placeholder="Methods">
                    </textarea>

                    <textarea id="processing"
                        placeholder="Processing">
                    </textarea>

                    <textarea id="software"
                        placeholder="Software">
                    </textarea>

                    <textarea id="standards"
                        placeholder="Standards">
                    </textarea>

                    <textarea id="conditions"
                        placeholder="Conditions">
                    </textarea>

                    <textarea id="qa"
                        placeholder="QA Procedures">
                    </textarea>

                    <textarea id="personnel"
                        placeholder="Personnel">
                    </textarea>

                </div>
            </details>

            <h2>Datasets / Files</h2>

            <button id="addDataset">
                Add Dataset/File
            </button>

            <div id="datasets"></div>

            <h2>Optional Sections</h2>

            <button id="addSection">
                Add Section
            </button>

            <div id="customSections"></div>

        </div>

        <div class="panel">

            <h2>Live README Preview</h2>

            <div id="preview" class="preview"></div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
